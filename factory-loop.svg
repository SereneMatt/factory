<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="900" viewBox="0 0 1480 900">
  <rect width="1480" height="900" fill="#efeae2"/>
  <rect x="0" y="0" width="1480" height="8" fill="#1c1917"/>

  <text x="56" y="52" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="13" letter-spacing="3.2" fill="#78716c">FACTORY</text>
  <text x="56" y="96" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="36" font-weight="700" fill="#1c1917">Two sessions for every item</text>
  <text x="56" y="132" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="16" fill="#57534e">Collect grilled items from Linear. Implement each one. Review what was built in another session.</text>

  <!-- 01 Linear -->
  <rect x="56" y="168" width="300" height="108" rx="14" fill="#fffcf8" stroke="#1c1917" stroke-width="1.5"/>
  <text x="80" y="202" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" letter-spacing="1.8" fill="#9a3412">01</text>
  <text x="80" y="232" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="22" font-weight="700" fill="#1c1917">Linear</text>
  <text x="80" y="256" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="15" fill="#57534e">Grilled items</text>

  <line x1="368" y1="222" x2="408" y2="222" stroke="#1c1917" stroke-width="1.5"/>
  <polygon points="408,216 420,222 408,228" fill="#1c1917"/>

  <!-- 02 Collect -->
  <rect x="432" y="168" width="360" height="108" rx="14" fill="#fffcf8" stroke="#1c1917" stroke-width="1.5"/>
  <text x="456" y="202" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" letter-spacing="1.8" fill="#9a3412">02</text>
  <text x="456" y="232" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="22" font-weight="700" fill="#1c1917">Collect</text>
  <text x="456" y="256" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="15" fill="#57534e">Every grilled item, into a queue</text>

  <line x1="804" y1="222" x2="844" y2="222" stroke="#1c1917" stroke-width="1.5"/>
  <polygon points="844,216 856,222 844,228" fill="#1c1917"/>

  <!-- 03 Loop -->
  <rect x="868" y="168" width="556" height="108" rx="14" fill="#1c1917"/>
  <text x="892" y="202" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" letter-spacing="1.8" fill="#fdba74">03</text>
  <text x="892" y="232" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="22" font-weight="700" fill="#fffcf8">For each grilled item</text>
  <text x="892" y="256" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="15" fill="#d6d3d1">One iteration. Then the next item.</text>

  <!-- Iteration panel -->
  <rect x="56" y="312" width="1368" height="528" rx="18" fill="#f7f4ee" stroke="#1c1917" stroke-width="1.5"/>
  <text x="84" y="352" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" letter-spacing="2.4" fill="#78716c">ONE ITERATION</text>

  <!-- Session 1 -->
  <rect x="84" y="376" width="430" height="300" rx="16" fill="#fffcf8" stroke="#1c1917" stroke-width="1.5"/>
  <rect x="84" y="376" width="430" height="64" rx="16" fill="#9a3412"/>
  <rect x="84" y="420" width="430" height="20" fill="#9a3412"/>
  <text x="108" y="406" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" letter-spacing="1.6" fill="#ffedd5">AGENT SESSION</text>
  <text x="108" y="428" font-family="iA Writer Mono S, Liberation Mono, monospace" font-size="18" fill="#fff7ed">/implement</text>

  <text x="108" y="476" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="16" fill="#1c1917">Fresh context</text>
  <text x="108" y="508" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="16" fill="#1c1917">implement skill</text>
  <text x="108" y="540" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="16" fill="#1c1917">This Linear item only</text>
  <text x="108" y="572" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="16" fill="#1c1917">Builds the work, then stops</text>
  <text x="108" y="640" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="13" fill="#78716c">Session ends when the build is ready</text>

  <!-- Arrow to handover -->
  <line x1="514" y1="526" x2="548" y2="526" stroke="#1c1917" stroke-width="1.5"/>
  <polygon points="548,520 560,526 548,532" fill="#1c1917"/>

  <!-- Handover -->
  <rect x="572" y="446" width="300" height="168" rx="14" fill="#1c1917"/>
  <text x="596" y="482" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" letter-spacing="1.8" fill="#fdba74">HANDOVER</text>
  <text x="596" y="516" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="18" font-weight="700" fill="#fffcf8">What was built</text>
  <text x="596" y="548" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="15" fill="#d6d3d1">Branch and diff</text>
  <text x="596" y="574" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="15" fill="#d6d3d1">The Linear item</text>

  <!-- Arrow to session 2 -->
  <line x1="872" y1="526" x2="906" y2="526" stroke="#1c1917" stroke-width="1.5"/>
  <polygon points="906,520 918,526 906,532" fill="#1c1917"/>

  <!-- Session 2 -->
  <rect x="930" y="376" width="458" height="300" rx="16" fill="#fffcf8" stroke="#1c1917" stroke-width="1.5"/>
  <rect x="930" y="376" width="458" height="64" rx="16" fill="#0f766e"/>
  <rect x="930" y="420" width="458" height="20" fill="#0f766e"/>
  <text x="954" y="406" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" letter-spacing="1.6" fill="#ccfbf1">ANOTHER AGENT SESSION</text>
  <text x="954" y="428" font-family="iA Writer Mono S, Liberation Mono, monospace" font-size="18" fill="#f0fdfa">/code-review</text>

  <text x="954" y="476" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="16" fill="#1c1917">New session, fresh context</text>
  <text x="954" y="508" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="16" fill="#1c1917">code-review skill</text>
  <text x="954" y="540" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="16" fill="#1c1917">Standards and spec</text>
  <text x="954" y="572" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="16" fill="#1c1917">Sees only the handover</text>
  <text x="954" y="640" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="13" fill="#78716c">Its own session, after the handover</text>

  <!-- Loop return -->
  <rect x="84" y="708" width="1304" height="96" rx="12" fill="#efeae2"/>
  <text x="108" y="748" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="16" font-weight="700" fill="#1c1917">Review finished</text>
  <text x="108" y="774" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="14" fill="#57534e">Take the next grilled item</text>

  <line x1="430" y1="756" x2="700" y2="756" stroke="#1c1917" stroke-width="1.5"/>
  <polygon points="430,750 418,756 430,762" fill="#1c1917"/>
  <text x="470" y="744" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="13" letter-spacing="1.2" fill="#78716c">BACK TO 03</text>

  <rect x="980" y="728" width="380" height="56" rx="10" fill="#fffcf8" stroke="#1c1917" stroke-width="1.5"/>
  <text x="1004" y="752" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="14" font-weight="700" fill="#1c1917">Queue empty</text>
  <text x="1004" y="772" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="13" fill="#57534e">Factory run complete</text>
</svg>
